name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "instructions/**"
      - "src/**"
      - "package-lock.json"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "biome.json"
      - "!**.md"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "instructions/**"
      - "src/**"
      - "package-lock.json"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "biome.json"
      - "!**.md"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: Main CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting And Lint
        run: npm run check

      - name: Typecheck
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Check NPM Package Contents
        run: npm pack --dry-run
