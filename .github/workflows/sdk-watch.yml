name: Pi SDK Watch

# Proactively watch the Pi coding-agent SDK. The extension's peer dependency is
# `*` (it runs against whatever Pi the user has), and `sdk-compat.ts` probes the
# SDK surface at runtime — but that is a *reactive* signal the user sees only
# after something degrades. This workflow is its repo-side, *proactive* twin:
# when a new `@earendil-works/pi-coding-agent` is published outside the tested
# range, it opens ONE self-rewriting draft PR that bumps the devDependency pins
# and `PLANNER_KNOWN_GOOD_PI_VERSIONS`, and runs typecheck + tests against the
# new SDK so the PR body carries a mechanical pass/fail compat signal.
#
# No spam: the PR always lives on the single `sdk-watch` branch (re-runs
# force-push it, so an open PR just refreshes in place) and is closed
# automatically once the SDK is back within range. The Pi SDK is excluded from
# Dependabot (see .github/dependabot.yml) so the two never open duplicate PRs.
#
# Note: PRs opened by the default GITHUB_TOKEN do not themselves trigger the
# `pull_request` CI workflow (a GitHub anti-recursion rule), which is exactly
# why the compat check runs *inline* here and is reflected in the PR body rather
# than relying on the PR's own CI run.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdk-watch
  cancel-in-progress: false

env:
  SDK: "@earendil-works/pi-coding-agent"
  TUI: "@earendil-works/pi-tui"
  WATCH_BRANCH: sdk-watch

jobs:
  watch:
    name: Watch Pi SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve Versions
        id: v
        run: |
          set -euo pipefail
          LATEST=$(npm view "$SDK" version)
          LATEST_MM=$(printf '%s' "$LATEST" | grep -oE '^[0-9]+\.[0-9]+')
          # Read the known-good major.minor prefixes straight from the source of
          # truth (src/constants/compat.ts), so this workflow and the runtime
          # advisory never drift apart.
          KNOWN=$(node -e "const s=require('fs').readFileSync('src/constants/compat.ts','utf8');const m=s.match(/PLANNER_KNOWN_GOOD_PI_VERSIONS[\s\S]*?=\s*\[([^\]]*)\]/);process.stdout.write(m?[...m[1].matchAll(/\"([^\"]+)\"/g)].map(x=>x[1]).join(' '):'')")
          IN_RANGE=no
          for mm in $KNOWN; do [ "$mm" = "$LATEST_MM" ] && IN_RANGE=yes; done
          BASE=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          {
            echo "latest=$LATEST"
            echo "latest_mm=$LATEST_MM"
            echo "known=$KNOWN"
            echo "in_range=$IN_RANGE"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "Pi SDK latest=$LATEST (mm=$LATEST_MM); known-good=[$KNOWN]; in_range=$IN_RANGE; base=$BASE"

      # --- back within range: retire the watch PR --------------------------
      - name: Close Watch PR When Back In Range
        if: steps.v.outputs.in_range == 'yes'
        run: |
          set -euo pipefail
          NUM=$(gh pr list --head "$WATCH_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh pr close "$NUM" --delete-branch \
              --comment "Pi SDK ${{ steps.v.outputs.latest }} is within the known-good range again — retiring this watch PR."
          fi

      # --- out of range: prepare the single self-rewriting bump branch -----
      - name: Prepare Bump Branch
        if: steps.v.outputs.in_range == 'no'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$WATCH_BRANCH" "origin/${{ steps.v.outputs.base }}"

          LATEST="${{ steps.v.outputs.latest }}"
          LATEST_MM="${{ steps.v.outputs.latest_mm }}"
          TUI_LATEST=$(npm view "$TUI" version)

          # Bump the two devDependency pins (used for typecheck + tests) and
          # rewrite the known-good constant to the new major.minor. Written with
          # tabs + trailing newline to match the repo's Biome formatting.
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.devDependencies['$SDK']='$LATEST';p.devDependencies['$TUI']='$TUI_LATEST';fs.writeFileSync(f,JSON.stringify(p,null,'\t')+'\n')"
          node -e "const fs=require('fs');const f='src/constants/compat.ts';let s=fs.readFileSync(f,'utf8');s=s.replace(/(PLANNER_KNOWN_GOOD_PI_VERSIONS[\s\S]*?=\s*\[)[^\]]*(\])/,'\$1\"$LATEST_MM\"\$2');fs.writeFileSync(f,s)"

          npm install

      - name: Validate Against The New SDK
        if: steps.v.outputs.in_range == 'no'
        id: check
        run: |
          set -uo pipefail
          # Swallow the exit code: a FAILING check is the most important case to
          # surface (that is the incompatibility), so it must still open the PR.
          if npm run build && npm test; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Push And Upsert Draft PR
        if: steps.v.outputs.in_range == 'no'
        run: |
          set -euo pipefail
          git add package.json package-lock.json src/constants/compat.ts
          if git diff --cached --quiet; then
            echo "No changes to push (already prepared)."
            exit 0
          fi
          git commit -m "chore(sdk): watch — adopt Pi SDK ${{ steps.v.outputs.latest }}"
          git push -f origin "$WATCH_BRANCH"

          if [ "${{ steps.check.outputs.result }}" = "pass" ]; then
            BADGE="✅ **typecheck + tests PASS** against ${{ steps.v.outputs.latest }} — likely a safe adoption."
          else
            BADGE="❌ **typecheck / tests FAIL** against ${{ steps.v.outputs.latest }} — the SDK surface probably changed; this is the incompatibility to fix before merging."
          fi

          # Build the PR body with printf (not a heredoc): every line stays
          # indented under the block scalar, so the YAML never mis-parses it.
          printf '%s\n' \
            "Automated **Pi SDK watch**. A new \`$SDK\` release is outside the tested range." \
            "" \
            "- latest: **${{ steps.v.outputs.latest }}**  ·  known-good: \`${{ steps.v.outputs.known }}\`" \
            "- $BADGE" \
            "" \
            "**What this PR changes**" \
            "- bumps the devDependency pins (\`$SDK\`, \`$TUI\`) used for typecheck + tests" \
            "- rewrites \`PLANNER_KNOWN_GOOD_PI_VERSIONS\` → \`${{ steps.v.outputs.latest_mm }}\`" \
            "" \
            "**Before merging** review the SDK surface probe in \`src/runtime/sdk-compat.ts\` (\`SDK_REQUIRED_SURFACES\`). If the check above failed, a required \`pi.*\` / \`ctx.*\` surface moved — fix the call sites, not just the pins." \
            "" \
            "_Self-rewriting: every run force-pushes the \`$WATCH_BRANCH\` branch, so there is only ever this one PR; it closes automatically when the SDK returns to range._" \
            > pr-body.md

          NUM=$(gh pr list --head "$WATCH_BRANCH" --base "${{ steps.v.outputs.base }}" --state open --json number --jq '.[0].number // empty')
          TITLE="chore(sdk): adopt Pi SDK ${{ steps.v.outputs.latest }}"
          if [ -z "$NUM" ]; then
            gh pr create --draft --base "${{ steps.v.outputs.base }}" --head "$WATCH_BRANCH" --title "$TITLE" --body-file pr-body.md
          else
            gh pr edit "$NUM" --title "$TITLE" --body-file pr-body.md
            echo "Refreshed existing draft PR #$NUM (no new PR)."
          fi
          rm -f pr-body.md
